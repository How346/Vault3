name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Analyze and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: flutter_app

    steps:
      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────
      # Java 17
      # ─────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ─────────────────────────────────────────────
      # Flutter
      # ─────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      # ─────────────────────────────────────────────
      # Doctor
      # ─────────────────────────────────────────────
      - name: Flutter Doctor
        run: flutter doctor -v

      # ─────────────────────────────────────────────
      # Dependencies
      # ─────────────────────────────────────────────
      - name: Get Dependencies
        run: flutter pub get

      # ─────────────────────────────────────────────
      # Remove obsolete Firebase Messaging implementation.
      # Remote push is handled exclusively by OneSignal.
      # This also protects CI from an accidentally reintroduced legacy file.
      # ─────────────────────────────────────────────
      - name: Remove legacy Firebase push service
        shell: bash
        run: |
          set -euo pipefail
          rm -f lib/services/firebase_service.dart
          if grep -RInE "package:firebase_core|package:firebase_messaging|RemoteMessage|FirebaseMessaging|showRemoteMessage" lib --include='*.dart'; then
            echo "Legacy Firebase Messaging references found in Dart source."
            exit 1
          fi

      # ─────────────────────────────────────────────
      # Analyze the checked-in source; CI must never rewrite Dart/Android files.
      # ─────────────────────────────────────────────
      - name: Analyze Flutter
        run: flutter analyze

      # ─────────────────────────────────────────────
      # Generate launcher icons
      # ─────────────────────────────────────────────
      - name: Generate App Icons
        run: dart run flutter_launcher_icons

      # ─────────────────────────────────────────────
      # Remove only the obsolete notification XML resource.
      # Never delete notification_icon.png: the notification service uses it.
      # ─────────────────────────────────────────────
      

      # ─────────────────────────────────────────────
      # Clean
      # ─────────────────────────────────────────────
      - name: Clean Flutter Build
        run: flutter clean

      # ─────────────────────────────────────────────
      # Get dependencies again after clean
      # ─────────────────────────────────────────────
      - name: Get Dependencies Again
        run: flutter pub get

      # ─────────────────────────────────────────────
      # Final analysis
      # ─────────────────────────────────────────────
      - name: Final Flutter Analyze
        run: flutter analyze


      # ─────────────────────────────────────────────
      # Build Release APK
      # ─────────────────────────────────────────────
      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # ─────────────────────────────────────────────
      # Verify APK exists
      # ─────────────────────────────────────────────
      

      # ─────────────────────────────────────────────
      # Upload APK
      # ─────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
