name: doc_wallet
description: Offline-first, privacy-first document wallet.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local storage (no cloud)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Capture / pick / crop
  camera: ^0.11.0+2
  google_mlkit_text_recognition: ^0.13.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  file_picker: ^8.1.2
  image: ^4.2.0

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5
  permission_handler: ^11.3.1

  # Reminders + sharing
  flutter_local_notifications: ^17.2.3

  # Push notifications (OneSignal, backed by Firebase Cloud Messaging)
  onesignal_flutter: ^5.2.7
  timezone: ^0.9.4
  flutter_timezone: ^5.1.0
  share_plus: ^10.0.2

  # Viewing
  open_filex: ^4.5.0
  intl: ^0.19.0

  # Offline device-to-device migration
  shelf: ^1.4.1
  archive: ^3.6.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

  # App launcher icons
  flutter_launcher_icons: ^0.14.4

# Android launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
